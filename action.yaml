name: Container Build Push
description: Action to build a container and push it to the container repo
inputs:
  version:
    description: The version of the container
    required: true
  component:
    description: The component name
    required: false
    default: ""
  push:
    description: Push the container to the container repo
    required: false
    default: "true"
  acr-client-id:
    description: Azure Container Registry client id
    required: true
  acr-client-secret:
    description: Azure Container Registry client secret
    required: true
  auth-token:
    description: Dependency auth token
    required: false
  working-dir:
    description: The working directory of the project
    required: false
    default: "."
  build-contexts:
    description: Additional build contexts
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Generate DateTime
      run: |
        echo "NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
      shell: bash
      
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: myvyoma-bscqhjacgqesdtbw.azurecr.io
        username: ${{ inputs.acr-client-id }}
        password: ${{ inputs.acr-client-secret }}

    - name: Set Docker Tag
      run: |
        if [ -z "${{ inputs.component }}" ]; then
          echo "DOCKER_TAG=${{ github.event.repository.name }}:${{ inputs.version }}" >> $GITHUB_ENV
        else
          echo "DOCKER_TAG=${{ github.event.repository.name }}/${{ inputs.component }}:${{ inputs.version }}" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Build and push Docker images
      uses: docker/build-push-action@v6
      with:
        pull: true
        push: ${{ inputs.push }}
        tags: myvyoma-bscqhjacgqesdtbw.azurecr.io/containers/${{ env.DOCKER_TAG }}
        context: ${{ inputs.working-dir }}
        build-contexts: ${{ inputs.build-contexts }}
        labels: |
          org.opencontainers.image.created=${{ env.NOW }}
          org.opencontainers.image.version=${{ inputs.version }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.vendor=Vyoma
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
